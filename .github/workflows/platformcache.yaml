on:
  workflow_call:
    inputs:
      package-name:
        type: string
        default: builders
        description: 'The package name to use for storing cached builders'
      platform-files:
        required: true
        type: string
        description: 'Paths to Dockerfiles to cache'
      runs-on:
        required: true
        type: string
    outputs:
      platforms:
        value: ${{jobs.d.outputs.platforms}}
      platform-list:
        value: ${{jobs.d.outputs.platform-list}}
      base-image:
        value: ${{jobs.build-base.outputs.base-image}}

permissions:
  packages: read
  contents: read

jobs:
  d:
    name: Discover Platforms
    runs-on: ubuntu-latest
    outputs:
      missing-platforms: ${{steps.discover.outputs.missing-platforms}}
      platforms: ${{steps.discover.outputs.platforms}}
      platform-list: ${{steps.discover.outputs.platform-list}}
      base-exists: ${{steps.check-base.outputs.exists}}
      base-image: ${{steps.check-base.outputs.image}}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Wire-Network/platform-cache-workflow
          ref: v1
          path: platformdiscovery

      - name: Checkout calling repo for base.Dockerfile check
        uses: actions/checkout@v4
        with:
          path: calling-repo

      - name: Check if base.Dockerfile exists
        id: check-base
        run: |
          if [ -f "calling-repo/.cicd/platforms/base.Dockerfile" ]; then
            echo "Base Dockerfile found"
            BASE_HASH=$(sha256sum calling-repo/.cicd/platforms/base.Dockerfile | cut -d' ' -f1 | head -c 12)
            IMAGE="ghcr.io/${{github.repository_owner}}/${{inputs.package-name}}:base-${BASE_HASH}"
            
            echo "image=$IMAGE" >> $GITHUB_OUTPUT
            
            # Check if image exists in registry
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "Base image exists: $IMAGE"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Base image needs building: $IMAGE"
            fi
          else
            echo "No base.Dockerfile found, skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "image=" >> $GITHUB_OUTPUT
          fi

      - name: Discover Platforms
        id: discover
        uses: ./platformdiscovery/.github/actions/discover-platforms
        with:
          platform-files: ${{inputs.platform-files}}
          password: ${{github.token}}
          package-name: ${{inputs.package-name}}

      - name: Debug discovered outputs
        run: |
          echo "missing-platforms: ${{steps.discover.outputs.missing-platforms}}"
          echo "platform-list: ${{steps.discover.outputs.platform-list}}"
          echo "platforms: ${{steps.discover.outputs.platforms}}"
          echo "base-exists: ${{steps.check-base.outputs.exists}}"
          echo "base-image: ${{steps.check-base.outputs.image}}"

  build-base:
    name: Build Base Image
    needs: d
    if: needs.d.outputs.base-exists == 'false'
    runs-on: ${{fromJSON(inputs.runs-on)}}
    permissions:
      packages: write
      contents: read
    outputs:
      base-image: ${{needs.d.outputs.base-image}}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}

      - name: Build and push base image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          file: .cicd/platforms/base.Dockerfile
          tags: |
            ${{needs.d.outputs.base-image}}
            ghcr.io/${{github.repository_owner}}/${{inputs.package-name}}:base-latest
          cache-from: type=registry,ref=ghcr.io/${{github.repository_owner}}/${{inputs.package-name}}:base-latest
          cache-to: type=inline

  build-platforms:
    name: Build Platforms
    needs: [d, build-base]
    if: always() && needs.d.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{fromJSON(needs.d.outputs.missing-platforms)}}
    runs-on: ${{matrix.platform == 'none' && 'ubuntu-latest' || fromJSON(inputs.runs-on)}}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Container Registry
        if: matrix.platform != 'none'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{github.token}}

      - name: Build and push variant
        if: matrix.platform != 'none'
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{fromJSON(needs.d.outputs.platforms)[matrix.platform].image}}
          file: ${{fromJSON(needs.d.outputs.platforms)[matrix.platform].file}}
          target: ${{fromJSON(needs.d.outputs.platforms)[matrix.platform].target}}
          build-args: |
            BASE_IMAGE=${{needs.d.outputs.base-image}}
          cache-from: |
            type=registry,ref=${{fromJSON(needs.d.outputs.platforms)[matrix.platform].image}}
            type=registry,ref=ghcr.io/${{github.repository_owner}}/${{inputs.package-name}}:base-latest
          cache-to: type=inline